<!DOCTYPE html>

<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>🏃 Endless Run</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div id="game">

        <div id="topbar">

            <div>
                ❤️ <span id="lives">3</span>
            </div>

            <div>
                💰 <span id="coins">0</span>
            </div>

            <div>
                📏 <span id="score">0</span>
            </div>

        </div>


        <canvas id="canvas"></canvas>


        <div id="message">

            <div id="messageTitle">
                🏃 RUN!
            </div>

            <div id="messageText">
                躲开障碍物！
            </div>

            <button id="startButton">
                🎮 开始
            </button>

        </div>


        <div id="controls">

            <button
                id="jumpButton"
                class="control"
            >
                ⬆️
                <span>跳跃</span>
            </button>


            <button
                id="duckButton"
                class="control"
            >
                ⬇️
                <span>下蹲</span>
            </button>

        </div>

    </div>


    <script src="game.js"></script>

</body>

</html>
